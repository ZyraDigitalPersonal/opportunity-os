<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpportunityOS</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0d1117">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Navegación">
      <div class="brand"><img class="brand-logo" src="/favicon.svg" alt="" width="24" height="24"><span>OpportunityOS</span></div>
      <a class="nav-item" href="#/hoy" data-nav="today">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
        Hoy
      </a>
      <a class="nav-item" href="#/" data-nav="explore">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        Explorar mercado
      </a>
      <a class="nav-item" href="#/pipeline" data-nav="pipeline">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></svg>
        Pipeline
      </a>
      <a class="nav-item" href="#/ajustes" data-nav="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
        Ajustes
      </a>
      <a class="nav-item" href="#/ayuda" data-nav="help">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6"/><path d="M12 17h.01"/></svg>
        Ayuda y contacto
      </a>
      <div class="sidebar-card" id="sidebar-card">
        <strong>¿Necesitas ayuda?</strong>
        <span>Pregunta al asistente o escribe a ZYRA.</span>
        <button class="btn btn-sm btn-primary" type="button" data-open-assistant>Abrir asistente</button>
      </div>
      <div class="sidebar-foot">
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Cambiar tema">Tema</button>
        <a class="icon-btn" href="/logout">Salir</a>
      </div>
    </aside>
    <main id="app" tabindex="-1"></main>
  </div>
  <button class="fab" type="button" data-open-assistant aria-label="Abrir asistente">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.8 7L4 20l1.1-4.6A8 8 0 1 1 21 12Z"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01"/></svg>
    <span>Asistente</span>
  </button>
  <aside class="assistant" id="assistant" hidden aria-label="Asistente de OpportunityOS">
    <header><div><strong>Asistente</strong><small id="assistant-model">Sabe lo que estás viendo · pregúntale por cualquier negocio</small></div><button class="icon-btn" type="button" id="assistant-close" aria-label="Cerrar">✕</button></header>
    <div class="assistant-log" id="assistant-log" aria-live="polite"></div>
    <div class="assistant-suggest" id="assistant-suggest"></div>
    <form id="assistant-form"><label class="sr-only" for="assistant-input">Pregunta</label><input id="assistant-input" autocomplete="off" placeholder="Escribe tu pregunta…" maxlength="1500"><button class="btn btn-primary btn-sm" type="submit">Enviar</button></form>
  </aside>
</body>
</html>
